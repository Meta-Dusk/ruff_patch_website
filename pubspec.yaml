name: capstone_website
description: "An e-Learning Website for Dog Owners."
publish_to: "none"
version: 0.1.0+1

environment:
    sdk: ^3.11.3

dependencies:
    flutter:
        sdk: flutter
    go_router: ^18.0.2
    url_launcher: ^6.3.3
    youtube_player_iframe: ^6.0.2

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^6.0.0

flutter:
    uses-material-design: true
    assets:
        - assets/
        - assets/images/
        - assets/fonts/
    fonts:
        - family: Born2B
          fonts:
              - asset: assets/fonts/Born2bSportyFS.otf
        - family: LiberationSans
          fonts:
              - asset: assets/fonts/LiberationSans-Bold.ttf
              - asset: assets/fonts/LiberationSans-BoldItalic.ttf
              - asset: assets/fonts/LiberationSans-Italic.ttf
              - asset: assets/fonts/LiberationSans-Regular.ttf
